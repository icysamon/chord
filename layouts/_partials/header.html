{{- partial "menu.html" (dict "menuID" "main" "page" .) }}
{{- with .Site.Params.license.terms }}
  <div style="margin-block:1rem; background-color: var(--background-color-card); border-radius: var(--border-radius-default); box-shadow: var(--shadow-post);">
    {{- with $.Site.Params.image }}
    <a href="/">
      <img src={{- . }} width="100%" height="350px" style="object-fit: cover; border-radius: var(--border-radius-default); center; display: block;">
    </a>
    {{- end }}
  </div>
{{- end }}
