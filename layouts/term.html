{{ define "main" }}
  <h1>{{ .Title }}</h1>
  
  {{ range .Pages }}
    <div class="card">
      <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ if .Params.audio }}
            <audio controls preload="auto" src="{{ .Params.audio }}"></audio>
      {{ end }}
    </div>
  {{ end }}
{{ end }}
